<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada · Conquistou</title>
<script>
  // O endereço diferencia maiúsculas: /testetempo (como o teclado do celular escreve) vai para /testeTempo/
  if (/^\/teste-?tempo\/?$/i.test(location.pathname)) location.replace("/testeTempo/");
  // Área do responsável: /Painel, /PAINEL... vão para /painel/
  if (/^\/painel\/?$/i.test(location.pathname)) location.replace("/painel/" + location.hash);
</script>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; padding: 64px 16px; background: #fff; color: #0E1236; }
  a { color: #2F66FF; font-weight: 700; }
  @media (prefers-color-scheme: dark) { body { background: #0E1236; color: #fff; } a { color: #8FB0FF; } }
</style>
</head>
<body>
<h1>Página não encontrada</h1>
<p><a href="/">Voltar para o Conquistou</a></p>
</body>
</html>
